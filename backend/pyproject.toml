[project]
name = "smart-classroom-backend"
version = "0.1.0"
description = "FastAPI backend for the Smart Classroom Assistant (kindergarten AI assistant)"
requires-python = ">=3.12"
# Versions are pinned; update deliberately and re-run the tests.
dependencies = [
    "fastapi==0.162.6",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "asyncpg==0.32.0",
    "pyjwt[crypto]==2.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a real dev database (TEST_DATABASE_URL); skipped otherwise",
]
